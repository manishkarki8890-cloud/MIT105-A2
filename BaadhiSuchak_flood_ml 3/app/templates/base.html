<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BaadhiSuchak · Flood Risk</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#16181d;--ink2:#555a63;--line:#e3e1dc;--brand:#0e4d78;--brand2:#2a78d6;
--ok:#0ca30c;--watch:#c98500;--warn:#ec835a;--sev:#d03b3b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--brand);color:#fff}header .in{max-width:1180px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.logo{font-weight:800;font-size:19px;letter-spacing:.2px}.logo small{display:block;font-weight:400;font-size:12px;opacity:.8}
nav a{color:#cfe3f5;text-decoration:none;margin-right:18px;font-weight:600;font-size:14px;padding-bottom:4px}
nav a.on{color:#fff;border-bottom:2px solid #fff}
main{max-width:1180px;margin:auto;padding:22px 20px 40px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--ink2);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1.1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:860px){.g2,.g3{grid-template-columns:1fr}}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.ok{background:var(--ok)}.watch{background:var(--watch)}.warn{background:var(--warn)}.sev{background:var(--sev)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--ink2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
form.inline{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:16px}
label{font-size:12px;color:var(--ink2);font-weight:600;display:block;margin-bottom:4px}
input,select{font:inherit;padding:8px 10px;border:1px solid #cfccc5;border-radius:8px;background:#fff;min-width:0;width:100%}
button{font:inherit;font-weight:700;background:var(--brand2);color:#fff;border:0;border-radius:8px;padding:9px 18px;cursor:pointer}
.bar{height:8px;background:#eceae5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%}
.muted{color:var(--ink2);font-size:13px}.big{font-size:44px;font-weight:800;line-height:1}
footer{max-width:1180px;margin:auto;padding:0 20px 30px;color:var(--ink2);font-size:12px}
</style></head><body>
<header><div class="in"><div class="logo">🌊 BaadhiSuchak<small>Next-day flood risk · Nepal river stations</small></div>
<nav><a href="/" class="{{'on' if page=='dash'}}">Dashboard</a><a href="/station" class="{{'on' if page=='station'}}">Station history</a>
<a href="/predict" class="{{'on' if page=='predict'}}">What-if forecast</a><a href="/about" class="{{'on' if page=='about'}}">Model</a></nav></div></header>
<main>{% block body %}{% endblock %}</main>
<footer>Prototype for research/education. Not an official DHM warning. Model: {{name or 'Random Forest'}} · alert threshold p ≥ {{'%.3f'|format(thr)}}</footer>
</body></html>
